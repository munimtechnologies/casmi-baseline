[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "casmi-baseline"
version = "0.1.0"
description = "Dependency-free spectral-library-search baseline and MRR@25 scorer for small-molecule identification from MS/MS (Enveda CASMI 2026)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "MV2 of Munim, Inc." }]
keywords = ["mass-spectrometry", "metabolomics", "spectral-entropy", "casmi", "cheminformatics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
rdkit = ["rdkit"]

[project.urls]
Homepage = "https://github.com/munimv2/casmi-baseline"

[tool.setuptools]
py-modules = ["casmi_baseline"]
